name: CI
run-name: Reclamation timing diagnostic (138579)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reclamation-diagnostic-138579
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  diagnostic:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3baf393d5bb9acfe62e01e023ec5ef0543de1f8d
          persist-credentials: false
      - name: Checkout diagnostic inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .diagnostic
          sparse-checkout: scripts/diagnostics
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: "24.19.0"
          install-bun: "false"
          dependency-cache: "true"
          vitest-fs-cache: "true"
          node-compile-cache: "true"
          node-compile-cache-scope: test
      - name: Record resource and source inputs
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          nproc
          cat /proc/meminfo
          cat /sys/fs/cgroup/cpu.max
          cat /sys/fs/cgroup/memory.max
          cat /sys/fs/cgroup/cpu.stat
          cat .diagnostic/scripts/diagnostics/reclamation-group.json
          git diff --exit-code
          git diff --cached --exit-code
      - name: Trace original first test group
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_MAX_WORKERS: "2"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
          OPENCLAW_VITEST_SHARD_NAME: compact-small-8
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_VITEST_NO_OUTPUT_RETRY: "0"
          OPENCLAW_TEST_RECLAMATION_LOG: "1"
        run: |
          set -euo pipefail
          editor="$GITHUB_WORKSPACE/.diagnostic/scripts/diagnostics/reclamation-timing.mjs"
          node "$editor" --check
          trap 'test_status=$?; node "$editor" --restore || exit 1; git diff --exit-code || exit 1; exit "$test_status"' EXIT
          node "$editor" --apply
          export OPENCLAW_NODE_TEST_GROUPS_JSON="$(cat .diagnostic/scripts/diagnostics/reclamation-group.json)"
          time -p node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee "$RUNNER_TEMP/reclamation-diagnostic.log"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reclamation-diagnostic-138579-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reclamation-diagnostic.log
            ${{ runner.temp }}/reclamation-diagnostic-inputs
          retention-days: 7
          if-no-files-found: warn
      - name: Record final resource counters
        if: always()
        run: |
          cat /sys/fs/cgroup/cpu.stat
          cat /sys/fs/cgroup/memory.peak
          git status --short
