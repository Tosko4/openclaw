name: Docker Approval Scheduling Canary
run-name: Docker approval scheduling canary - ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: Canary observation label
        required: true
        type: choice
        options:
          - waiting
          - approved

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: docker-release
    permissions: {}
    steps:
      - name: Record approval
        run: printf 'Canary approval completed\n'

  writer:
    needs: approve
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: docker-release
    concurrency:
      group: docker-credentials-canary-20260911-1846735b
      cancel-in-progress: false
      queue: max
    permissions: {}
    steps:
      - name: Observe writer scheduling
        run: |
          printf 'Canary writer started\n'
          sleep 5
          printf 'Canary writer completed\n'
